<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 · 美食食谱分享平台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="profile">

  <nav class="nav">
    <div class="nav-inner">
      <a class="logo" href="index.html"><span>🍳</span>美食食谱分享</a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="recipes.html">菜谱库</a>
        <a href="publish.html">发布菜谱</a>
        <a href="profile.html" class="active">我的</a>
        <a href="about.html">关于</a>
        <a href="login.html" class="nav-user">登录 / 注册</a>
      </nav>
    </div>
  </nav>

  <main class="profile-wrap">
    <!-- 未登录 -->
    <div id="profile-guest" class="panel guest-box" hidden>
      <h2 style="font-size:22px;margin-bottom:12px">你还未登录</h2>
      <p style="color:#8a8a8a;margin-bottom:22px">登录后即可查看我的收藏、点赞、评论与投稿记录。</p>
      <a href="login.html" class="btn btn-primary" style="display:inline-block">去登录 / 注册</a>
    </div>

    <!-- 已登录 -->
    <div id="profile-main" hidden>
      <div class="profile-head">
        <div class="profile-avatar" id="profile-avatar">U</div>
        <div>
          <h1 id="profile-name">用户</h1>
          <p class="muted">美食爱好者 · 本地账号</p>
        </div>
        <a href="publish.html" class="btn btn-primary">+ 发布菜谱</a>
      </div>

      <div class="profile-stats" id="profile-stats"></div>

      <div class="profile-tabs">
        <button data-ptab="favs" class="active">我的收藏</button>
        <button data-ptab="likes">我的点赞</button>
        <button data-ptab="comments">我的评论</button>
        <button data-ptab="recipes">我的投稿</button>
        <button data-ptab="history">浏览历史</button>
      </div>

      <div id="profile-content"></div>

      <div style="margin-top:36px">
        <button class="btn btn-fav" id="profile-logout">退出登录</button>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="f-logo">🍳 美食食谱分享平台</div>
    <p>基于 HTML + CSS + JavaScript 实现 · 毕业设计作品</p>
    <p>© 2027 美食食谱分享平台</p>
  </footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
